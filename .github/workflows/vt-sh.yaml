name: Analysis
on:
  repository_dispatch:
    types: [analysis]
  workflow_dispatch:
    inputs:
      subject_url:
        description: 'The subject URL from the GitHub notification'
        required: true
        type: string
      repository_FullName:
        description: 'Repo Name'
        required: false
      tag_Name:
        description: 'Tag'
        required: false
      html_Url:
        description: 'HTML URL'
        required: false
        
# for test
# https://api.github.com/repos/akashdh11/skystream/releases/308091331

jobs:
  vt-cli:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: ${{ github.event.inputs.repository_FullName }} - ${{ github.event.inputs.tag_Name }}
        run: |
          subject_url="${{ github.event.inputs.subject_url || github.event.client_payload.subject_url }}"
          echo
          echo "subject_url=$subject_url" >> $GITHUB_ENV
          echo ${{ github.event.inputs.html_Url }}

      - name: Cache vt
        id: cache-vt
        uses: actions/cache@v5
        with:
          path: ~/vt
          key: vt-${{ runner.os }}-vt-1.3.0
          # restore-keys: vt-${{ runner.os }}-
    
      - name: Cache jq
        id: cache-jq
        uses: actions/cache@v5
        with:
          path: ~/jq
          key: jq-${{ runner.os }}-jq-1.8.1
  
      - name: Download and install vt
        if: steps.cache-vt.outputs.cache-hit != 'true'
        run: |
          curl -L -o vt.zip https://github.com/VirusTotal/vt-cli/releases/download/1.3.0/Linux64.zip
          echo "2d3d67c84e9cf43c50b6655af73f8df010e1185370059a0c9c72ff39dd33def4 vt.zip" | sha256sum -c
          unzip vt.zip
          chmod +x vt
          mv vt ~/vt
  
      - name: Download and install jq
        if: steps.cache-jq.outputs.cache-hit != 'true'
        run: |
          curl -L -o jq https://github.com/jqlang/jq/releases/download/jq-1.8.1/jq-linux-amd64
          echo "020468de7539ce70ef1bceaf7cde2e8c4f2ca6c3afb84642aabc5c97d9fc2a0d jq" | sha256sum -c
          chmod +x jq
          mv jq ~/jq
  
      - name: Add GITHUB_PATH
        run: |
          echo "$HOME" >> "$GITHUB_PATH"
          mkdir -p /home/runner/.cache
  
      - name: extract apk(s) urls
        id: find-apk-urls
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api $subject_url --jq '.assets[].browser_download_url' > all_urls

          cat all_urls | grep -iE '(arm64|armv8a?|\bv8a?\b).*?\.apk$' > ft_urls || \
          cat all_urls | grep -iE '\.apk$'  > ft_urls || \
          cat all_urls | grep -iE '\.(apks|eapk)$' > ft_urls || true

          cat ft_urls | grep -iE -v '\b(arm32|armeabi|armhf|armv7a?|v7a?|x86[-_]64|x86)\b.*?\.apk$' > dl_urls || true

          cat dl_urls | grep -Ei '^https?' || echo "skip=true" >> $GITHUB_OUTPUT

          echo 'dl_urls - filter#1'
          cat dl_urls

      - name: download apk(s)
        if: steps.find-apk-urls.outputs.skip != 'true'
        run: |
          mkdir dl_apk
          curl -L --remote-name-all -Z --output-dir dl_apk $(cat dl_urls)
        
      - name: vt scan files
        id: scan-urls
        if: steps.find-apk-urls.outputs.skip != 'true'
        run: |
          cd dl_apk
          vt -k ${{ secrets.VT_KEY }} scan file *

      - name: vt browser URLs
        if: steps.find-apk-urls.outputs.skip != 'true'
        run: |
          cd dl_apk
          while read -r hash file; do 
            echo $file; echo "https://www.virustotal.com/gui/file/$hash"; 
          done < <(sha256sum *)
          
